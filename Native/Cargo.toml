[package]
name = "freedom"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
description = "Freedom Network native network intelligence & privacy core (std-only, zero third-party crates)"
license = "LicenseRef-Proprietary"
publish = false

# Single source of truth for the native build. Zero third-party dependencies by policy.
[dependencies]

[lib]
name = "freedom"
path = "Core.rs"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"     # required: every JNI entry point uses catch_unwind so no panic crosses FFI
debug = false
strip = "symbols"
overflow-checks = true
incremental = false

[profile.dev]
panic = "unwind"
overflow-checks = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "allow"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
